DATA:
  DATASET: tvrid_rgb
  ROOT: ./data
  IDS_PER_BATCH: 12
  REPS_PER_ID: 6
  IMG_SIZE: 224
  EVAL_FRAMES: 5
  NUM_WORKERS: 4
  EMBEDDINGS_PATH: weights/tvrid_embeddings.json

MODEL:
  PRETRAINED_PATH: weights/eva02_l_bio_best.pth

LOSS:
  CLIP_TEMPERATURE: 0.07
  CLIP_LEARN_TEMPERATURE: true

SOLVER:
  OPTIMIZER: SGD
  LR: 1e-4
  WARMUP_EPOCHS: 1
  MAX_EPOCHS: 2
  EVAL_STEPS: 100
  GRAD_CLIP: 10.0
  SEED: 1234
  MINING_TEMPERATURE: 2.0

AUG:
  HFLIP: 0.5
  VFLIP: 0.3
  RANDOM_CROP: 0.5
  COLOR_JITTER: 0.5
  RANDOM_ERASING: 0.25
